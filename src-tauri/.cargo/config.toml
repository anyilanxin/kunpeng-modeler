# index.crates.io 在当前网络不可达，走 rsproxy.cn 镜像（sparse 协议）
[source.crates-io]
replace-with = 'rsproxy-sparse'

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[target.x86_64-pc-windows-msvc]
linker = "lld"
rustflags = [
  "-Lnative=/Users/zxuanhong/.xwin/crt/lib/x86_64",
  "-Lnative=/Users/zxuanhong/.xwin/sdk/lib/um/x86_64",
  "-Lnative=/Users/zxuanhong/.xwin/sdk/lib/ucrt/x86_64"
]
